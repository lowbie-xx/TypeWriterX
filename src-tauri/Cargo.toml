[package]
name = "typewriterx"
version = "0.1.0"
description = "A lightweight typewriter-emulating word processor"
authors = ["TypeWriterX contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "typewriterx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
